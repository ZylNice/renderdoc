[project]
name = "rendertest-mcp"
version = "1.0.0"
description = "MCP server for Rendertest (modified RenderDoc) graphics debugging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0,<3.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
rendertest-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.uv]
package = true
dev-dependencies = []
